<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe 访问测试工具（支持代理）</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .iframe-container {
            border: 2px solid #ddd;
            border-radius: 4px;
            margin-top: 20px;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
        }
        .test-results {
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #e9ecef;
            max-height: 300px;
            overflow-y: auto;
        }
        .radio-group {
            margin: 15px 0;
        }
        .radio-group label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }
        .help-box {
            background-color: #e7f3ff;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #b3d9ff;
            margin-top: 15px;
        }
        .help-box h3 {
            margin-top: 0;
            color: #004085;
        }
        .help-box code {
            background-color: #f8f9fa;
            padding: 2px 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>iframe 访问测试工具（支持代理）</h1>

    <div class="container">
        <div class="input-group">
            <label for="targetUrl">目标URL：</label>
            <input type="url" id="targetUrl" placeholder="https://fy.anyremote.cn:8334" value="https://fy.anyremote.cn:8334">
        </div>

        <div class="radio-group">
            <label><input type="radio" name="mode" value="direct" checked> 直接访问</label>
            <label><input type="radio" name="mode" value="proxy"> 通过代理访问</label>
        </div>

        <div class="input-group" id="proxyConfig" style="display: none;">
            <label for="proxyUrl">代理服务器URL：</label>
            <input type="text" id="proxyUrl" placeholder="http://localhost:5005/proxy/" value="http://localhost:5005/proxy/">
        </div>

        <button onclick="startTest()">开始测试</button>
        <button onclick="testFetch()">测试 Fetch 访问</button>
        <button onclick="clearResults()">清除结果</button>
    </div>

    <div id="statusDiv"></div>
    <div id="helpBox" class="help-box" style="display: none;">
        <h3>使用说明</h3>
        <div id="helpContent"></div>
    </div>

    <div class="iframe-container" id="iframeContainer" style="display: none;">
        <iframe
            id="testFrame"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
            onload="onIframeLoad()"
            onerror="onIframeError()">
        </iframe>
    </div>

    <div id="testResults" class="test-results" style="display: none;"></div>

    <script>
        let testResults = [];
        let sessionId = '';
        let previousUrl = '';

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            testResults.push(`[${timestamp}] ${type.toUpperCase()}: ${message}`);
            updateTestResults();
        }

        function updateTestResults() {
            const resultsDiv = document.getElementById('testResults');
            if (testResults.length > 0) {
                resultsDiv.style.display = 'block';
                resultsDiv.textContent = testResults.join('\n');
                resultsDiv.scrollTop = resultsDiv.scrollHeight;
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusDiv');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function showHelp(content) {
            const helpBox = document.getElementById('helpBox');
            const helpContent = document.getElementById('helpContent');
            helpContent.innerHTML = content;
            helpBox.style.display = 'block';
        }

        function clearResults() {
            testResults = [];
            document.getElementById('testResults').style.display = 'none';
            document.getElementById('statusDiv').innerHTML = '';
            document.getElementById('helpBox').style.display = 'none';
            document.getElementById('iframeContainer').style.display = 'none';
            document.getElementById('testFrame').src = '';
        }

        function generateSessionId() {
            return 'sess_' + Math.random().toString(36).substring(2, 15) +
                   Math.random().toString(36).substring(2, 15);
        }

        function getAccessUrl() {
            const targetUrl = document.getElementById('targetUrl').value.trim();
            const mode = document.querySelector('input[name="mode"]:checked').value;

            if (mode === 'proxy') {
                const proxyUrl = document.getElementById('proxyUrl').value.trim();
                sessionId = generateSessionId();
                const fullProxyUrl = proxyUrl + sessionId + '/';
                log(`使用代理模式: ${fullProxyUrl}`);
                log(`实际目标: ${targetUrl}`);
                return fullProxyUrl;
            } else {
                log(`使用直接模式: ${targetUrl}`);
                return targetUrl;
            }
        }

        function startTest() {
            const url = getAccessUrl();
            if (!url) {
                showStatus('请输入有效的URL', 'error');
                return;
            }

            log(`开始测试 iframe 访问`);

            // 显示 iframe
            const iframeContainer = document.getElementById('iframeContainer');
            const iframe = document.getElementById('testFrame');

            iframeContainer.style.display = 'block';

            // 设置 iframe 源
            try {
                iframe.src = url;
                log(`iframe src 已设置为: ${url}`);

                // 显示帮助信息
                showHelp(getModeHelp());
            } catch (error) {
                log(`设置 iframe src 时出错: ${error.message}`, 'error');
                showStatus(`设置 iframe 失败: ${error.message}`, 'error');
            }
        }

        function getModeHelp() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            if (mode === 'proxy') {
                return `
                    <p><strong>代理模式</strong> - 通过本地代理服务器访问目标应用</p>
                    <ol>
                        <li>确保代理服务器已启动: <code>python proxy_server.py</code></li>
                        <li>会话ID: <code>${sessionId || '未生成'}</code></li>
                        <li>在 iframe 内进行登录操作</li>
                        <li>系统会自动检测登录状态变化</li>
                    </ol>
                    <p><strong>优势：</strong> 避免跨域问题，支持完整的登录流程</p>
                    <p><strong>注意：</strong> 如果代理服务未启动，请先运行 <code>python proxy_server.py</code></p>
                `;
            } else {
                return `
                    <p><strong>直接模式</strong> - 直接访问目标应用</p>
                    <ol>
                        <li>直接在 iframe 内登录</li>
                        <li>如果遇到跨域问题，请切换到代理模式</li>
                        <li>观察页面URL变化，检测登录状态</li>
                    </ol>
                    <p><strong>优势：</strong> 简单快速，无额外配置</p>
                    <p><strong>注意：</strong> 可能遇到登录后重定向问题</p>
                `;
            }
        }

        function onIframeLoad() {
            log('iframe 加载成功', 'success');
            showStatus('✅ iframe 加载成功！', 'success');

            try {
                const iframe = document.getElementById('testFrame');
                const currentUrl = iframe.contentWindow.location.href;

                log(`iframe 标题: ${iframe.contentDocument.title}`);
                log(`iframe 当前URL: ${currentUrl}`);

                // 检测登录页面
                if (currentUrl.includes('/login') || currentUrl.includes('/signin') || currentUrl.includes('/auth')) {
                    log('检测到登录页面，请在 iframe 内输入用户名密码登录', 'info');
                }

                // 检测 URL 变化
                if (previousUrl && currentUrl !== previousUrl && !currentUrl.includes('/login')) {
                    log(`检测到URL变化: ${previousUrl} -> ${currentUrl}`, 'success');
                    showStatus('✅ 检测到页面变化，可能已登录成功', 'success');
                }

                previousUrl = currentUrl;

            } catch (error) {
                log(`无法访问 iframe 内容 (跨域限制): ${error.message}`, 'warning');
                log('注意: 这是正常的跨域安全限制，但您仍可以在 iframe 内手动登录', 'info');
            }
        }

        function onIframeError() {
            log('iframe 加载失败', 'error');
            showStatus('❌ iframe 加载失败！请检查网络连接或切换访问模式', 'error');
        }

        async function testFetch() {
            const targetUrl = document.getElementById('targetUrl').value.trim();
            if (!targetUrl) {
                showStatus('请输入有效的URL', 'error');
                return;
            }

            log(`测试 Fetch 访问: ${targetUrl}`);

            try {
                const response = await fetch(targetUrl, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });

                log(`响应状态: ${response.status} ${response.statusText}`);
                log(`CORS头部: ${response.headers.get('Access-Control-Allow-Origin') || '未设置'}`);

                if (response.ok) {
                    showStatus('✅ Fetch 访问成功！服务器支持 CORS', 'success');
                } else {
                    showStatus(`⚠️ Fetch 访问返回状态码: ${response.status}`, 'warning');
                }
            } catch (error) {
                log(`Fetch 访问失败: ${error.message}`, 'error');
                showStatus('❌ Fetch 访问失败 - 可能需要使用代理模式', 'error');
            }
        }

        // 监听来自 iframe 的消息
        window.addEventListener('message', function(event) {
            // 验证消息来源
            const targetUrl = document.getElementById('targetUrl').value.trim();
            const allowedOrigin = new URL(targetUrl).origin;

            if (event.origin !== allowedOrigin && event.origin !== window.location.origin) {
                log(`收到来自未知来源的消息: ${event.origin}`, 'info');
                return;
            }

            if (event.data && event.data.type === 'loginSuccess') {
                log('🎉 检测到登录成功！', 'success');
                showStatus('🎉 登录成功！检测到认证信息已保存', 'success');
            }

            if (event.data && event.data.type === 'loginAttempt') {
                log(`尝试登录: ${event.data.url}`, 'info');
                showStatus('⏳ 正在登录...', 'info');
            }
        });

        // 监听模式切换
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const proxyConfig = document.getElementById('proxyConfig');
                proxyConfig.style.display = this.value === 'proxy' ? 'block' : 'none';
            });
        });

        // 页面加载完成
        window.addEventListener('load', function() {
            log('测试页面已加载');
            log('建议：首次使用请先尝试"直接模式"，如遇问题再切换"代理模式"');
        });
    </script>
</body>
</html>
