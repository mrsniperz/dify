<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe 测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="url"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .iframe-container {
            border: 2px solid #ddd;
            border-radius: 4px;
            margin-top: 20px;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .test-results {
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <h1>iframe 访问测试工具</h1>

    <div class="container">
        <div class="input-group">
            <label for="urlInput">请输入要测试的URL:</label>
            <input type="url" id="urlInput" placeholder="https://localhost:3000" value="http://localhost:3000">
        </div>
        <button onclick="testIframe()">测试 iframe 访问</button>
        <button onclick="testWithFetch()">同时测试 Fetch 访问</button>
        <button onclick="clearResults()">清除结果</button>
    </div>

    <div id="statusDiv"></div>

    <div class="iframe-container" id="iframeContainer" style="display: none;">
        <iframe
            id="testFrame"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
            onload="onIframeLoad()"
            onerror="onIframeError()">
        </iframe>
    </div>
    <div id="loginPrompt" style="display: none; margin-top: 10px; padding: 10px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px;">
        <strong>登录提示：</strong> 如果登录后被重定向，请检查以下几点：
        <ul>
            <li>确保已在 iframe 内完成登录</li>
            <li>检查浏览器开发者工具的 Console 和 Network 面板</li>
            <li>如果问题持续，可能需要使用代理服务（见下方说明）</li>
        </ul>
    </div>

    <div id="testResults" class="test-results" style="display: none;"></div>

    <script>
        let testResults = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            testResults.push(`[${timestamp}] ${type.toUpperCase()}: ${message}`);
            updateTestResults();
        }

        function updateTestResults() {
            const resultsDiv = document.getElementById('testResults');
            if (testResults.length > 0) {
                resultsDiv.style.display = 'block';
                resultsDiv.textContent = testResults.join('\n');
                resultsDiv.scrollTop = resultsDiv.scrollHeight;
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusDiv');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function clearResults() {
            testResults = [];
            document.getElementById('testResults').style.display = 'none';
            document.getElementById('statusDiv').innerHTML = '';
            document.getElementById('iframeContainer').style.display = 'none';
            document.getElementById('testFrame').src = '';
        }

        function testIframe() {
            const url = document.getElementById('urlInput').value.trim();

            if (!url) {
                showStatus('请输入有效的URL', 'error');
                return;
            }

            log(`开始测试 iframe 访问: ${url}`);

            // 显示 iframe
            const iframeContainer = document.getElementById('iframeContainer');
            const iframe = document.getElementById('testFrame');

            iframeContainer.style.display = 'block';

            // 设置 iframe 源
            try {
                iframe.src = url;
                log(`iframe src 已设置为: ${url}`);
            } catch (error) {
                log(`设置 iframe src 时出错: ${error.message}`, 'error');
                showStatus(`设置 iframe 失败: ${error.message}`, 'error');
            }
        }

        let previousUrl = '';
        const TARGET_DOMAIN = 'https://fy.anyremote.cn:8334';

        function onIframeLoad() {
            log('iframe 加载成功', 'success');
            showStatus('✅ iframe 加载成功！链接可以在 iframe 中正常访问', 'success');
            document.getElementById('loginPrompt').style.display = 'block';

            // 尝试检查 iframe 内容
            try {
                const iframe = document.getElementById('testFrame');
                const currentUrl = iframe.contentWindow.location.href;

                log(`iframe 标题: ${iframe.contentDocument.title}`);
                log(`iframe 当前URL: ${currentUrl}`);

                // 检测是否是登录页面
                if (currentUrl.includes('/login') || currentUrl.includes('/signin')) {
                    log('检测到登录页面，请输入用户名密码进行登录', 'info');
                }

                // 检测 URL 变化（可能是登录后重定向）
                if (previousUrl && currentUrl !== previousUrl && !currentUrl.includes('/login')) {
                    log(`检测到URL变化: ${previousUrl} -> ${currentUrl}`, 'success');

                    // 通知父窗口
                    iframe.contentWindow.parent.postMessage({
                        type: 'redirectDetected',
                        url: currentUrl
                    }, '*');

                    showStatus('✅ 检测到页面变化，可能已登录成功', 'success');
                }

                previousUrl = currentUrl;

                // 在 iframe 内注入脚本检测登录状态
                try {
                    const script = iframe.contentDocument.createElement('script');
                    script.textContent = `
                        // 检测登录状态变化
                        let lastLoginState = localStorage.getItem('login-state') || '';
                        const checkInterval = setInterval(() => {
                            // 检测 localStorage 变化
                            for (let key in localStorage) {
                                if (key.includes('token') || key.includes('auth') || key.includes('session')) {
                                    if (localStorage[key] !== lastLoginState) {
                                        lastLoginState = localStorage[key];
                                        parent.postMessage({
                                            type: 'loginSuccess',
                                            key: key
                                        }, '*');
                                    }
                                }
                            }

                            // 检测 DOM 变化（例如登录按钮消失）
                            const loginBtn = document.querySelector('button[type="submit"], .login-btn, [data-testid="login-button"]');
                            if (!loginBtn && document.querySelector('.user-menu, .profile-menu, [data-testid="user-avatar"]')) {
                                parent.postMessage({
                                    type: 'loginSuccess',
                                    indicator: 'DOM change'
                                }, '*');
                            }
                        }, 1000);

                        // 检测到登录页面的事件监听
                        const forms = document.querySelectorAll('form');
                        forms.forEach(form => {
                            form.addEventListener('submit', () => {
                                setTimeout(() => {
                                    parent.postMessage({
                                        type: 'submitAttempt',
                                        url: window.location.href
                                    }, '*');
                                }, 2000);
                            });
                        });
                    `;
                    iframe.contentDocument.head.appendChild(script);
                } catch (e) {
                    log('无法注入检测脚本（跨域限制）', 'info');
                }

            } catch (error) {
                log(`无法访问 iframe 内容 (跨域限制): ${error.message}`, 'info');
                log('注意: 这是正常的跨域安全限制，不影响 iframe 正常显示', 'info');
                log('但您仍可以在 iframe 内手动登录', 'info');
            }
        }

        function onIframeError() {
            log('iframe 加载失败', 'error');
            showStatus('❌ iframe 加载失败！链接无法在 iframe 中访问', 'error');
        }

        // 处理来自 iframe 的消息
        window.addEventListener('message', function(event) {
            // 验证消息来源
            const targetUrl = document.getElementById('urlInput').value.trim();
            const allowedOrigin = new URL(targetUrl).origin;

            if (event.origin !== allowedOrigin && event.origin !== window.location.origin) {
                log(`收到来自未知来源的消息: ${event.origin}`, 'info');
                return;
            }

            if (event.data && event.data.type === 'loginSuccess') {
                log('检测到登录成功事件', 'success');
                showStatus('✅ 登录成功！', 'success');
            }

            if (event.data && event.data.type === 'redirectDetected') {
                log(`检测到重定向到: ${event.data.url}`, 'info');
                showStatus('⚠️ 检测到重定向，请检查是否已正确登录', 'info');
            }
        });

        async function testWithFetch() {
            const url = document.getElementById('urlInput').value.trim();

            if (!url) {
                showStatus('请输入有效的URL', 'error');
                return;
            }

            log(`开始测试 Fetch 访问: ${url}`);

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache',
                    credentials: 'same-origin'
                });

                log(`Fetch 响应状态: ${response.status} ${response.statusText}`);
                log(`CORS 头部: ${response.headers.get('Access-Control-Allow-Origin') || '未设置'}`);

                if (response.ok) {
                    showStatus('✅ Fetch 访问成功！服务器支持 CORS', 'success');
                } else {
                    showStatus(`⚠️ Fetch 访问返回状态码: ${response.status}`, 'info');
                }
            } catch (error) {
                log(`Fetch 访问失败: ${error.message}`, 'error');

                if (error.message.includes('CORS')) {
                    showStatus('❌ CORS 错误！服务器未正确配置跨域访问', 'error');
                } else if (error.message.includes('Failed to fetch')) {
                    showStatus('❌ 网络错误！无法连接到目标服务器', 'error');
                } else {
                    showStatus(`❌ 其他错误: ${error.message}`, 'error');
                }
            }
        }

        // 监听 iframe 安全策略错误
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'iframeError') {
                log(`iframe 内部错误: ${event.data.message}`, 'error');
            }
        });

        // 页面加载时自动测试本地 dify
        window.addEventListener('load', function() {
            log('测试页面已加载，可以开始测试');
            log('当前页面来源: ' + window.location.origin);
        });
    </script>
</body>
</html>
